[config]
type = "scheme-vibrant"
reload_apps = true
[config.wallpaper]
set = true
command = "awww img {{ image }} -t fade --transition-duration 0.5 --transition-step 255 --transition-fps 60 -f Nearest"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors/colors.conf"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors/colors.conf"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors/colors.rasi"

[templates.waybar]
input_path = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/waybar/colors/colors.css"

[templates.gtk]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.conf"
post_hook = "cp ~/.config/gtk-3.0/colors.conf ~/.config/gtk-4.0/colors.conf"

[templates.cava]
input_path = "~/.config/matugen/templates/cava-colors.conf"
output_path = "~/.config/cava/themes/matugen.conf"
# post_hook = "cp ~/.config/cava/themes/matugen.conf ~/.config/cava/themes/matugen && ~/.config/waybar/scripts/launch.sh"
[templates.swaync]
input_path = "~/.config/matugen/templates/swaync-colors.css"
output_path = "~/.config/swaync/colors/colors.css"
# Reload swaync's CSS live after every wallpaper change — no restart needed.
post_hook = "swaync-client -rs"