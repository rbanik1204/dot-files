# ──────────────────────────────────────────────────────────────────────────────
#  ~/.config/matugen/wallpaper-picker.conf
#  Settings for wallpaper-picker.sh
# ──────────────────────────────────────────────────────────────────────────────

# ── Wallhaven API ─────────────────────────────────────────────────────────────
# Get your key from: https://wallhaven.cc/settings/account
WH_API_KEY="eoaWc2RGbwowx7n4dFvQI9owXIeY3i6R"

# ── Content filters ───────────────────────────────────────────────────────────
# Categories: 3-digit binary string — General | Anime | People
WH_CATEGORIES="111"

# Purity: 3-digit binary string — SFW | Sketchy | NSFW (NSFW needs API key)
WH_PURITY="100"

# ── Sorting ───────────────────────────────────────────────────────────────────
# Options: date_added | relevance | random | views | favorites | toplist
WH_SORTING="toplist"

# Top range (only applies when WH_SORTING=toplist)
# Options: 1d | 3d | 1w | 1M | 3M | 6M | 1y
WH_TOPRANGE="1M"

# ── Resolution ────────────────────────────────────────────────────────────────
# Minimum resolution to fetch (e.g. your monitor resolution)
WH_ATLEAST="1920x1080"

# ── How many Wallhaven results to show in the picker ─────────────────────────
WH_FETCH_COUNT=20