# ░█░█░█░█░█▀█░█▀▄░█░░░█▀█░█▀▀░█░█
# ░█▀█░░█░░█▀▀░█▀▄░█░░░█░█░█░░░█▀▄
# ░▀░▀░░▀░░▀░░░▀░▀░▀▀▀░▀▀▀░▀▀▀░▀░▀

# ─────────────────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────────────────
general {
    hide_cursor = true
}

# ─────────────────────────────────────────────────────
# BACKGROUND
# Deeply blurred, darkened, color-boosted
# ─────────────────────────────────────────────────────
background {
    monitor           =
    path              = /home/ratul/Pictures/Wallpapers/street.jpg
    blur_passes       = 2
    blur_size         = 1
    noise             = 0.015
    contrast          = 0.85
    brightness        = 0.60
    vibrancy          = 0.21
    vibrancy_darkness = 0.3
}

# ─────────────────────────────────────────────────────
# ░░ LEFT — MASSIVE CLOCK ░░
# Cinematic, left-anchored, full typographic dominance
# ─────────────────────────────────────────────────────

# HOUR — giant hero element
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H")"
    color       = rgba(255, 255, 255, 0.93)
    font_size   = 160
    font_family = JetBrainsMono Nerd Font Bold
    position    = -340, 100
    halign      = center
    valign      = center
    shadow_passes = 3
    shadow_size   = 20
    shadow_color  = rgba(0, 0, 0, 0.70)
    shadow_boost  = 1.5
    zindex      = 2
}

# MINUTES — muted, offset right of hours
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +":%M")"
    color       = rgba(255, 255, 255, 0.32)
    font_size   = 90
    font_family = JetBrainsMono Nerd Font
    position    = -110, 65
    halign      = center
    valign      = center
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = rgba(0, 0, 0, 0.50)
    zindex      = 2
}

# DAY OF WEEK — strong, just below the clock
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%A")"
    color       = rgba(255, 255, 255, 0.82)
    font_size   = 28
    font_family = JetBrainsMono Nerd Font Bold
    position    = -340, -28
    halign      = center
    valign      = center
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0, 0, 0, 0.50)
    zindex      = 2
}

# DATE — subtle, under day
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%d %B %Y")"
    color       = rgba(255, 255, 255, 0.42)
    font_size   = 16
    font_family = JetBrainsMono Nerd Font
    position    = -340, -60
    halign      = center
    valign      = center
    zindex      = 2
}

# AM/PM — tiny accent
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%p")"
    color       = rgba(180, 210, 255, 0.40)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = -220, -60
    halign      = center
    valign      = center
    zindex      = 2
}

# ─────────────────────────────────────────────────────
# ░░ VERTICAL DIVIDER ░░
# ─────────────────────────────────────────────────────
shape {
    monitor  =
    size     = 1, 300
    color    = rgba(255, 255, 255, 0.12)
    rounding = 0
    position = 65, 25
    halign   = center
    valign   = center
    zindex   = 2
}

# ─────────────────────────────────────────────────────
# ░░ RIGHT — PROFILE + LOGIN CARD ░░
# ─────────────────────────────────────────────────────

# Profile image
image {
    monitor      =
    path         = /home/ratul/Pictures/profile.png
    size         = 96
    rounding     = -1
    border_size  = 2
    border_color = rgba(255, 255, 255, 0.38)
    position     = 310, 130
    halign       = center
    valign       = center
    shadow_passes = 3
    shadow_size   = 14
    shadow_color  = rgba(0, 0, 0, 0.60)
    shadow_boost  = 1.2
    zindex       = 3
}

# Name
label {
    monitor     =
    text        = 󰀄  rbanik1204
    color       = rgba(180, 210, 255, 0.95)
    font_size   = 24
    font_family = JetBrainsMono Nerd Font Bold

    position    = 310, 48
    halign      = center
    valign      = center

    shadow_passes = 3
    shadow_size   = 8
    shadow_color  = rgba(0, 0, 0, 0.65)
    shadow_boost  = 1.2

    zindex      = 3
}

# Dynamic greeting
label {
    monitor     =
    text = cmd[update:3600000] bash -c 'h=$(date +%H); if [ "$h" -lt 5 ]; then echo "🌙  Good Night"; elif [ "$h" -lt 12 ]; then echo "󰖚  Good Morning"; elif [ "$h" -lt 17 ]; then echo "☀️  Good Afternoon"; else echo "󰖔  Good Evening"; fi'
    color       = rgba(170, 205, 255, 0.65)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 310, 18
    halign      = center
    valign      = center
    zindex      = 3
}

# ─────────────────────────────────────────────────────
# PASSWORD FIELD
# Sleek frosted glass, rich feedback states
# ─────────────────────────────────────────────────────
input-field {
    monitor  =
    size     = 275, 50
    rounding = 12

    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(8, 8, 18, 0.60)
    font_color  = rgba(255, 255, 255, 1.0)
    font_family = JetBrainsMono Nerd Font

    dots_size     = 0.24
    dots_spacing  = 0.22
    dots_center   = true
    dots_rounding = -1

    placeholder_text = '<span foreground="##7a7d9a" font_size="12pt">  enter password</span>'

    fade_on_empty = true
    fade_timeout  = 1000

    check_color     = rgba(120, 215, 150, 0.95)
    fail_color      = rgba(235, 95, 95, 0.90)
    fail_text       = '<span foreground="##eb5f5f" font_size="11pt"> wrong password</span>'
    # fail_timeout    = 2500
    # fail_transition = 400

    capslock_color = rgba(255, 205, 70, 0.90)
    numlock_color  = rgba(160, 215, 255, 0.85)

    position = 310, -52
    halign   = center
    valign   = center
    zindex   = 3
}

# Unlock hint
label {
    monitor     =
    text        = ↵  press enter to unlock
    color       = rgba(255, 255, 255, 0.16)
    font_size   = 10
    font_family = JetBrainsMono Nerd Font
    position    = 310, -88
    halign      = center
    valign      = center
    zindex      = 3
}

# ─────────────────────────────────────────────────────
# ░░ BOTTOM STRIP — Ambient ambient ambient ░░
# ─────────────────────────────────────────────────────

# Weather — bottom left
label {
    monitor     =
    text = cmd[update:600000] curl -s "wttr.in/Chinsurah?format=%l:+%c+%t+%h+%w"
    color       = rgba(255, 255, 255, 0.45)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = -600, -300
    halign      = center
    valign      = center
    zindex      = 2
}

# Uptime — bottom right
label {
    monitor     =
    text        = cmd[update:60000] echo "󰔚  $(uptime -p | sed 's/up //')"
    color       = rgba(255, 255, 255, 0.28)
    font_size   = 12
    font_family = JetBrainsMono Nerd Font
    position    = 600, -300
    halign      = center
    valign      = center
    zindex      = 2
}

# Timezone — center
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H:%M:%S  ·  %Z")"
    color       = rgba(255, 255, 255, 0.18)
    font_size   = 11
    font_family = JetBrainsMono Nerd Font
    position    = 0, -300
    halign      = center
    valign      = center
    zindex      = 2
}
bind = , Print, exec, grimblast copy area